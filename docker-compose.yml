# Brings up PostGIS (with the schema pre-loaded) and the FastAPI service.
#   docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: floodscope
      POSTGRES_USER: floodscope
      POSTGRES_PASSWORD: floodscope
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - floodscope_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      FLOODSCOPE_DB_HOST: db
      FLOODSCOPE_DB_PORT: 5432
      FLOODSCOPE_DB_NAME: floodscope
      FLOODSCOPE_DB_USER: floodscope
      FLOODSCOPE_DB_PASSWORD: floodscope
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  floodscope_pg:
